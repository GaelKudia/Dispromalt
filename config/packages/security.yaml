security:

    role_hierarchy:
        ROLE_CAISSIER:       ROLE_USER
        ROLE_CHEF_COMPTA:    [ROLE_USER, ROLE_COMPTA]
        ROLE_COORDON:        ROLE_USER
        ROLE_STOCK:          ROLE_USER
        ROLE_COMPTA:         ROLE_USER
        ROLE_GUERITE:        ROLE_USER
        ROLE_ACCUEIL:        ROLE_USER
        ROLE_RECEPTION:      ROLE_USER
        ROLE_DG:             ROLE_USER
        ROLE_ADMIN:
            - ROLE_DG
            - ROLE_COORDON
            - ROLE_STOCK
            - ROLE_COMPTA
            - ROLE_GUERITE
            - ROLE_ACCUEIL
            - ROLE_RECEPTION
            - ROLE_ALLOWED_TO_SWITCH

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:

        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator
            entry_point: App\Security\AppAuthenticator

            logout:
                path: app_logout
                target: app_login
                invalidate_session: true
                delete_cookies:
                    PHPSESSID:
                        path: /
                        domain: null
                    REMEMBERME:
                        path: /
                        domain: null

            # ✅ remember_me totalement retiré pour éviter le bug
            # Si tu veux le remettre plus tard, ajoute :
            # remember_me:
            #     secret: '%kernel.secret%'
            #     lifetime: 604800
            #     path: /
            #     always_remember_me: false    # ← JAMAIS "true"

    access_control:

        - { path: ^/dashboard/rapport/, roles: [ROLE_STOCK, ROLE_COMPTA] }

        - {
            path: ^/dashboard,
            roles: [
                ROLE_ADMIN,
                ROLE_COORDON,
                ROLE_STOCK,
                ROLE_COMPTA,
                ROLE_GUERITE,
                ROLE_ACCUEIL,
                ROLE_RECEPTION,
                ROLE_DG,
                ROLE_CAISSIER,
                ROLE_CHEF_COMPTA,
                ROLE_USER
            ]
          }

        - { path: ^/user, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10