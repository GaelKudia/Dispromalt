pwa:
    image_processor: 'pwa.image_processor.gd'

    manifest:
        enabled: true
        name: 'Gestion Digitale Dispromalt'
        short_name: 'Dispromalt'
        description: "Application de gestion de stock et bons de sortie pour l'imprimerie"
        start_url: '/'
        scope: '/'
        id: '/'
        display: 'standalone'
        orientation: 'any'
        background_color: '#ffffff'
        theme_color: '#317EFB'
        lang: 'fr'
        dir: 'ltr'
        categories: ['business', 'productivity']
        icons:
            - src: 'images/icons/32.png'
              sizes: [32]
              type: 'image/png'
            - src: 'images/icons/192.png'
              sizes: [192]
              type: 'image/png'
              purpose: 'any'
            - src: 'images/icons/512.png'
              sizes: [512]
              type: 'image/png'
              purpose: 'any maskable'
            - src: 'images/icons/512.png'
              sizes: [512]
              type: 'image/png'
              purpose: 'maskable'

    favicons:
        enabled: true
        default:
            src: 'images/icons/512.png'

    # ═════════════════════════════════════════════════════════════════════
    # SERVICE WORKER — DÉSACTIVÉ  ⬅️ MODIFIÉ
    # ═════════════════════════════════════════════════════════════════════
    # On utilise directement public/service-worker.js (fichier statique,
    # complet : push + notificationclick + skipWaiting + clients.claim()).
    #
    # Le bundle PWA générait un /sw.js à partir de assets/sw.js — or
    # assets/sw.js est VIDE, donc le bundle produisait un SW cassé qui
    # entrait en conflit de scope avec /service-worker.js et empêchait
    # les notifications de fonctionner (Chrome + iOS + Firefox).
    #
    # ⚠️ NE PAS RÉACTIVER tant que public/service-worker.js est utilisé.
    serviceworker:
        enabled: false