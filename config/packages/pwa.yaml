pwa:
    image_processor: 'pwa.image_processor.gd'

    manifest:
        enabled: true
        name: 'Gestion Digitale Dispromalt'
        short_name: 'Dispromalt'
        description: "Application de gestion de stock et bons de sortie pour l'imprimerie"
        start_url: '/'
        scope: '/'
        id: '/'
        display: 'standalone'
        orientation: 'any'
        background_color: '#ffffff'
        theme_color: '#317EFB'
        lang: 'fr'
        dir: 'ltr'
        categories: ['business', 'productivity']
        icons:
            - src: 'images/icons/32.png'
              sizes: [32]
              type: 'image/png'
            - src: 'images/icons/192.png'
              sizes: [192]
              type: 'image/png'
              purpose: 'any'
            - src: 'images/icons/512.png'
              sizes: [512]
              type: 'image/png'
              purpose: 'any maskable'
            - src: 'images/icons/512.png'
              sizes: [512]
              type: 'image/png'
              purpose: 'maskable'

    favicons:
        enabled: true
        default:
            src: 'images/icons/512.png'

    # ✅ SW ACTIVÉ avec TON propre code (pas de Workbox)
    serviceworker:
        enabled: true           # ⬅️ On l'active pour que {{ pwa() }} enregistre le SW
        src: 'sw.js'            # ⬅️ Lit assets/sw.js → compile vers public/sw.js
        skip_waiting: true
        workbox:
            enabled: false      # ⬅️ CRITIQUE : pas de Workbox, utilise TON code