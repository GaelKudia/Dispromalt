# .trivy.yaml
# ============================================================
# POLITIQUE DE SÉCURITÉ DES IMAGES — DISPROMALT
# ============================================================
# Ce fichier est la source de vérité pour tous les scans Trivy.
# Il est versionné et auditable.
#
# RÈGLE : on ne bloque que sur les CVE HIGH/CRITICAL
#         qui ont un correctif disponible (FixedVersion non vide).
#         Les CVE sans correctif amont (comme go-jose dans
#         FrankenPHP) sont ignorées pour ne pas bloquer le déploiement.
# ============================================================

# ------------------------------------------------------------
# Options globales
# ------------------------------------------------------------
timeout: 10m
quiet: false

# ------------------------------------------------------------
# Options de vulnérabilités
# ------------------------------------------------------------
vulnerability:
  # N'échouer que sur les CVE qui ont un correctif disponible
  # (les CVE "unfixed" sont ignorées)
  ignore-unfixed: true

  # Niveaux de sévérité à signaler
  severity:
    - CRITICAL
    - HIGH

# ------------------------------------------------------------
# Options de format (optionnel, pour la lisibilité locale)
# ------------------------------------------------------------
format: table


