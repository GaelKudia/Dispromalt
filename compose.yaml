services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: dispromalt_app
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: "mysql://app_user:app_password@database:3306/dispromalt_db?serverVersion=8.0&charset=utf8mb4"
      APP_SECRET: "un_secret_local_pour_le_conteneur"

  database:
    image: mysql:8.0
    container_name: dispromalt_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dispromalt_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql

  mailer:
    image: axllent/mailpit
    container_name: dispromalt-mailer
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  database_data: