# ============================================================
# SAST SECURITY SCAN
# ============================================================

name: SAST Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # 1. SEMGREP
  # ==========================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag: v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Semgrep
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep==1.99.0

      - name: Run Semgrep
        run: |
          set -euo pipefail
          semgrep scan --config auto --error .

  # ==========================================================
  # 2. GITLEAKS
  # ==========================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag: v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # tag: v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================
  # 3. TRIVY
  # ==========================================================
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag: v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # tag: 0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'



  # ==========================================================
  # 4. SECURITY GATE
  # ==========================================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-24.04
    needs:
      - semgrep
      - gitleaks
      - trivy
    if: always()
    permissions: {}
    steps:
      - name: Verify security results
        env:
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "          SECURITY GATE"
          echo "=========================================="
          echo "Semgrep  : $SEMGREP_RESULT"
          echo "Gitleaks : $GITLEAKS_RESULT"
          echo "Trivy    : $TRIVY_RESULT"

          if [ "$SEMGREP_RESULT" != "success" ]; then
            echo "❌ Semgrep failed."
            exit 1
          fi

          if [ "$GITLEAKS_RESULT" != "success" ]; then
            echo "❌ Gitleaks failed."
            exit 1
          fi

          if [ "$TRIVY_RESULT" != "success" ]; then
            echo "❌ Trivy failed."
            exit 1
          fi

          echo "=========================================="
          echo "✅ SECURITY GATE PASSED"
          echo "=========================================="