```yaml
# ============================================================
# SECURITY SCAN - DISPROMALT
#
# Contrôles :
#   1. Semgrep  -> SAST
#   2. Gitleaks -> secrets
#   3. Trivy    -> vulnérabilités fichiers/dépendances
#
# Si un contrôle de sécurité échoue :
#   -> le workflow échoue
#   -> le déploiement ne doit pas être lancé
#
# ============================================================

name: SAST Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Permissions minimales nécessaires
permissions:
  contents: read
  security-events: write

jobs:

  # ==========================================================
  # 1. SEMGREP - SAST
  # ==========================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Installation Semgrep
      # ------------------------------------------------------
      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep

      # ------------------------------------------------------
      # Scan SAST
      #
      # --config auto :
      # Semgrep sélectionne automatiquement les règles
      #
      # --sarif :
      # Génère un rapport compatible GitHub Security
      # ------------------------------------------------------
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            --error

      # ------------------------------------------------------
      # Upload du rapport
      #
      # IMPORTANT :
      # On utilise @v4 et PAS un faux SHA.
      # ------------------------------------------------------
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif


  # ==========================================================
  # 2. GITLEAKS - SECRETS
  # ==========================================================
  gitleaks:
    name: Gitleaks Secrets Scan
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Recherche :
      #   - API keys
      #   - passwords
      #   - tokens
      #   - secrets
      # ------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================
  # 3. TRIVY - DEPENDENCIES / FILESYSTEM
  # ==========================================================
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------
      # Scan du filesystem du projet
      #
      # Détecte notamment les vulnérabilités présentes
      # dans les dépendances.
      # ------------------------------------------------------
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

          # Bloque sur HIGH et CRITICAL
          severity: HIGH,CRITICAL

          # Les vulnérabilités sans correctif disponible
          # ne bloquent pas le pipeline.
          ignore-unfixed: true

          # Une vulnérabilité HIGH/CRITICAL fait échouer
          # le job.
          exit-code: "1"

      # ------------------------------------------------------
      # Upload rapport Trivy
      # ------------------------------------------------------
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif


  # ==========================================================
  # 4. SECURITY GATE
  #
  # Ce job vérifie que les 3 contrôles sont passés.
  # ==========================================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-24.04

    needs:
      - semgrep
      - gitleaks
      - trivy

    # Le gate doit toujours s'exécuter afin d'afficher
    # clairement le résultat des différents scanners.
    if: always()

    steps:

      - name: Security Gate
        run: |
          echo "=========================================="
          echo "          SECURITY GATE"
          echo "=========================================="

          echo ""
          echo "Semgrep  : ${{ needs.semgrep.result }}"
          echo "Gitleaks : ${{ needs.gitleaks.result }}"
          echo "Trivy    : ${{ needs.trivy.result }}"
          echo ""

          if [ "${{ needs.semgrep.result }}" != "success" ]; then
            echo "❌ Semgrep failed."
            exit 1
          fi

          if [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "❌ Gitleaks failed."
            exit 1
          fi

          if [ "${{ needs.trivy.result }}" != "success" ]; then
            echo "❌ Trivy failed."
            exit 1
          fi

          echo "=========================================="
          echo "✅ ALL SECURITY CHECKS PASSED"
          echo "=========================================="
```
