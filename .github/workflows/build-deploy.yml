# ============================================================
# BUILD + SECURITY SCAN + DEPLOY
#
# PIPELINE :
#
# SAST Security Scan
#        ↓
# Checkout du commit testé
#        ↓
# Docker Build
#        ↓
# Trivy Container Scan
#        ↓
# Push GHCR
#        ↓
# Coolify Deployment
#
# RÈGLE :
# Le déploiement est IMPOSSIBLE si le SAST ou Trivy échoue.
# ============================================================

name: Build and Deploy to Coolify


# ============================================================
# DÉCLENCHEMENT
#
# Ce workflow démarre uniquement après :
# "SAST Security Scan"
# ============================================================

on:
  workflow_run:
    workflows:
      - "SAST Security Scan"
    types:
      - completed
    branches:
      - main


# ============================================================
# ZERO TRUST
#
# Aucun droit par défaut.
# Les permissions sont définies uniquement au niveau du job.
# ============================================================

permissions: {}


# ============================================================
# CONCURRENCY
#
# Évite plusieurs déploiements simultanés sur main.
# ============================================================

concurrency:
  group: deploy-main
  cancel-in-progress: true


# ============================================================
# JOB
# ============================================================

jobs:
  build-deploy:
    name: Secure Build and Deploy


    # ========================================================
    # CONDITIONS DE SÉCURITÉ
    #
    # 1. Le workflow SAST doit réussir.
    # 2. Il doit avoir été déclenché par un push.
    # 3. Le commit doit être sur main.
    # 4. Le workflow doit appartenir au même repository.
    #
    # Cela empêche notamment un workflow provenant d'un fork
    # de déclencher ce déploiement privilégié.
    # ========================================================

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository


    # ========================================================
    # RUNNER
    # ========================================================

    runs-on: ubuntu-24.04


    # ========================================================
    # PERMISSIONS MINIMALES
    # ========================================================

    permissions:
      contents: read
      packages: write
      security-events: write


    # ========================================================
    # ÉTAPES
    # ========================================================

    steps:

      # ======================================================
      # 1. CHECKOUT DU MÊME COMMIT TESTÉ PAR LE SAST
      #
      # IMPORTANT :
      # On ne checkout PAS simplement main.
      # On checkout exactement le SHA testé par le workflow SAST.
      #
      # SÉCURITÉ : ce checkout est sûr malgré la règle Semgrep
      # `workflow-run-target-code-checkout`, car le bloc `if:`
      # ci-dessus impose :
      #   - event == 'push'                (pas de PR)
      #   - head_repository == this repo   (pas de fork)
      # Aucun code non fiable ne peut donc atteindre cette étape.
      # ======================================================

      - name: Checkout tested commit
        # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1


      # ======================================================
      # 2. VÉRIFICATION DU COMMIT
      #
      # On affiche le SHA réellement utilisé.
      # ======================================================

      - name: Verify tested commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected SHA : $EXPECTED_SHA"
          echo "Actual SHA   : $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Checked out commit does not match SAST commit."
            exit 1
          fi
          echo "Commit verification: OK"


      # ======================================================
      # 3. VARIABLES IMAGE DOCKER
      # ======================================================

      - name: Set image variables
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${REPOSITORY,,}"
          IMAGE_TAG="$COMMIT_SHA"
          IMAGE_REF="$IMAGE_NAME:$IMAGE_TAG"

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

          echo "============================================"
          echo "Docker image"
          echo "$IMAGE_REF"
          echo "============================================"


      # ======================================================
      # 4. DOCKER BUILDX
      # ======================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3


      # ======================================================
      # 5. LOGIN GHCR
      #
      # Le token GitHub est utilisé uniquement pour GHCR.
      # ======================================================

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # 6. BUILD DOCKER IMAGE
      #
      # L'image reste locale.
      # Elle n'est PAS encore poussée vers GHCR.
      # ======================================================

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --tag "$IMAGE_REF" \
            .


      # ======================================================
      # 7. VÉRIFICATION IMAGE
      # ======================================================

      - name: Verify Docker image
        run: |
          set -euo pipefail
          echo "Image construite : $IMAGE_REF"
          docker image inspect "$IMAGE_REF" > /dev/null
          echo "Docker image verification: OK"


      # ======================================================
      # 8. TRIVY CONTAINER SECURITY SCAN
      #
      # Scan :
      #
      # HIGH
      # CRITICAL
      #
      # Si une vulnérabilité HIGH ou CRITICAL est trouvée :
      #
      # exit-code = 1
      #
      # donc le job échoue.
      #
      # IMPORTANT :
      # Le push GHCR est APRÈS cette étape.
      # ======================================================

      - name: Trivy Container Security Scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-container.sarif
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "1"
          ignore-unfixed: true


      # ======================================================
      # 9. UPLOAD DU RAPPORT TRIVY
      #
      # Même si Trivy échoue, on essaie de publier le rapport.
      #
      # Cette étape ne peut PAS transformer un échec Trivy
      # en succès du job.
      # ======================================================

      - name: Upload Trivy container SARIF
        if: always() && hashFiles('trivy-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container


      # ======================================================
      # 10. PUSH GHCR
      #
      # Cette étape n'est exécutée QUE si toutes les étapes
      # précédentes ont réussi.
      #
      # Donc :
      #
      # SAST FAIL   → PAS DE PUSH
      #
      # Trivy FAIL  → PAS DE PUSH
      #
      # Trivy PASS  → PUSH
      # ======================================================

      - name: Push immutable Docker image
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"


      # ======================================================
      # 11. VÉRIFICATION DU PUSH
      #
      # On vérifie que l'image existe bien dans GHCR.
      # ======================================================

      - name: Verify pushed image
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker image inspect "$IMAGE_REF" > /dev/null
          echo "GHCR image verification: OK"


      # ======================================================
      # 12. TRIGGER COOLIFY
      #
      # Le déploiement Coolify ne se produit qu'après :
      #
      # SAST       = PASS
      # Docker     = PASS
      # Trivy      = PASS
      # GHCR Push  = PASS
      # ======================================================

      - name: Trigger Coolify Deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          # --------------------------------------------------
          # Vérification secrets
          # --------------------------------------------------

          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "ERROR: COOLIFY_WEBHOOK is not configured."
            exit 1
          fi

          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "ERROR: COOLIFY_TOKEN is not configured."
            exit 1
          fi

          # --------------------------------------------------
          # Déploiement
          # --------------------------------------------------

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request GET \
            --max-time 30 \
            "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

          echo "============================================"
          echo "Coolify deployment triggered successfully."
          echo "Image: $IMAGE_REF"
          echo "============================================"
