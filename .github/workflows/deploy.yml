name: Deploiement Automatique Dispromalt

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Recuperer le code du depot
      uses: actions/checkout@v3

    - name: Configurer PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl

    - name: Installer les dependances Composer
      run: |
        composer install --no-dev --optimize-autoloader

    - name: Compiler les assets PWA
      run: |
        php bin/console pwa:compile

    - name: Synchroniser les fichiers avec cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USERNAME }}
        password: ${{ secrets.CPANEL_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        local-dir: ./
        server-dir: /home/yumbatec/Gestion-stock-imprimerie-main/

    - name: Vider le cache de production sur cPanel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USERNAME }}
        key: ${{ secrets.CPANEL_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        script: |
          rm -rf /home/yumbatec/Gestion-stock-imprimerie-main/var/cache/*
          echo "Le cache Symfony de cPanel a ete nettoye avec succes !"
