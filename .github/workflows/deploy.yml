name: Deploiement Automatique Dispromalt

on:
  push:
    branches:
      - main

env:
  APP_ENV: prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. On récupère le code du dépôt GitHub
    - name: Recuperer le code du depot
      uses: actions/checkout@v3

    # 2. On configure PHP sur la machine GitHub
    - name: Configurer PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl

    # 3. On installe les dépendances Composer (sans les outils de dev)
    - name: Installer les dependances Composer
      run: |
        composer install --no-dev --optimize-autoloader --no-scripts

    # 4. On compile les assets de la PWA
    - name: Compiler les assets PWA
      run: |
        php bin/console pwa:compile

    # 5. Connexion directe en SSH via mot de passe uniquement
    - name: Connexion SSH et Deploiement cPanel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_
