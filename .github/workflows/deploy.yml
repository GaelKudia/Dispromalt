name: Deploiement Automatique Dispromalt

on:
  push:
    branches:
      - main

env:
  APP_ENV: prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code
    - name: Recuperer le code du depot
      uses: actions/checkout@v3

    # 2. Configurer PHP
    - name: Configurer PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl

    # 3. Installer les dépendances Composer
    - name: Installer les dependances Composer
      run: |
        composer install --no-dev --optimize-autoloader --no-scripts

    # 4. Compiler la PWA
    - name: Compiler les assets PWA
      run: |
        php bin/console pwa:compile

    # 5. Synchroniser les fichiers avec cPanel via SFTP (Sécurisé)
    # 5. Synchroniser les fichiers avec cPanel via SFTP (Sécurisé)
    - name: Synchroniser les fichiers avec cPanel
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        username: ${{ secrets.CPANEL_USERNAME }}
        server: ${{ secrets.CPANEL_HOST }} # Correction ici : 'server' au lieu de 'host'
        ssh_private_key: ${{ secrets.CPANEL_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        local_path: './'
        remote_path: '/home/yumbatec/Gestion-stock-imprimerie-main' # On retire l'étoile à la fin

    # 6. Vider le cache de production sur cPanel
    - name: Vider le cache de production sur cPanel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USERNAME }}
        key: ${{ secrets.CPANEL_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        script: |
          rm -rf /home/yumbatec/Gestion-stock-imprimerie-main/var/cache/*
          echo "Le cache Symfony de cPanel a ete nettoye avec succes !"
