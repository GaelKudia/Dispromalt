# ============================================================
# DAST SECURITY SCAN
# OWASP ZAP BASELINE
#
# OBJECTIF :
# Analyser dynamiquement l'application après déploiement.
#
# DÉCLENCHEMENTS :
# 1. Manuel depuis GitHub Actions.
# 2. Automatique via repository_dispatch après déploiement.
#
# CIBLE AUTORISÉE :
# gestion-digitale-dispromalt.com
# ============================================================

name: DAST Security Scan

# ============================================================
# DÉCLENCHEMENT
# ============================================================

on:

  # ----------------------------------------------------------
  # 1. DÉCLENCHEMENT MANUEL
  # ----------------------------------------------------------

  workflow_dispatch:
    inputs:
      target_url:
        description: "URL de l'application à scanner"
        required: false
        default: "https://gestion-digitale-dispromalt.com"
        type: string

  # ----------------------------------------------------------
  # 2. DÉCLENCHEMENT AUTOMATIQUE
  # ----------------------------------------------------------

  repository_dispatch:
    types:
      - coolify-deploy-success

# ============================================================
# PERMISSIONS MINIMALES
# ============================================================

permissions:
  contents: read

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# JOB
# ============================================================

jobs:

  zap-baseline:

    name: OWASP ZAP Baseline Scan

    runs-on: ubuntu-24.04

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      # ======================================================
      # 2. VALIDATION DE LA CIBLE
      #
      # Sécurité :
      # - HTTPS uniquement.
      # - Domaine strictement autorisé.
      # - Pas d'identifiants dans l'URL.
      # - Port 443 uniquement.
      # ======================================================

      - name: Validate target URL
        id: target

        env:
          INPUT_URL: ${{ github.event.inputs.target_url }}
          PAYLOAD_URL: ${{ github.event.client_payload.url }}

          ALLOWED_HOST: "gestion-digitale-dispromalt.com"

        run: |
          set -euo pipefail

          if [ -n "${INPUT_URL:-}" ]; then
            URL="$INPUT_URL"

          elif [ -n "${PAYLOAD_URL:-}" ]; then
            URL="$PAYLOAD_URL"

          else
            URL="https://gestion-digitale-dispromalt.com"
          fi

          python3 - "$URL" "$ALLOWED_HOST" <<'PY'
          import sys
          from urllib.parse import urlsplit

          url = sys.argv[1]
          allowed_host = sys.argv[2].lower()

          try:
              parsed = urlsplit(url)

              if parsed.scheme != "https":
                  raise ValueError("HTTPS obligatoire")

              if not parsed.hostname:
                  raise ValueError("Nom d'hôte manquant")

              host = parsed.hostname.lower().rstrip(".")

              if host != allowed_host:
                  raise ValueError("Domaine non autorisé : " + host)

              if parsed.username or parsed.password:
                  raise ValueError("Identifiants interdits dans l'URL")

              if parsed.port not in (None, 443):
                  raise ValueError("Seul le port 443 est autorisé")

              if parsed.fragment:
                  raise ValueError("Les fragments URL ne sont pas autorisés")

          except ValueError as error:
              print("ERREUR : " + str(error))
              sys.exit(1)

          print("Cible autorisée :", url)

          with open("/tmp/dast_target_url", "w") as file:
              file.write(url)
          PY

          VALIDATED_URL="$(cat /tmp/dast_target_url)"

          echo "url=$VALIDATED_URL" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "DAST TARGET VALIDATED"
          echo "$VALIDATED_URL"
          echo "=========================================="

      # ======================================================
      # 3. VÉRIFICATION DU FICHIER DE RÈGLES
      # ======================================================

      - name: Verify ZAP configuration
        run: |
          set -euo pipefail

          if [ ! -f ".zap/rules.tsv" ]; then
            echo "ERROR: .zap/rules.tsv is missing."
            exit 1
          fi

          echo "ZAP rules file found."

      # ======================================================
      # 4. OWASP ZAP BASELINE SCAN
      #
      # Analyse passive :
      # - Headers HTTP
      # - Cookies
      # - Configurations de sécurité
      # - Informations exposées
      #
      # fail_action: false
      # Les alertes sont rapportées sans bloquer le workflow.
      # ======================================================

      - name: OWASP ZAP Baseline Scan

        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.14.0

        with:
          target: ${{ steps.target.outputs.url }}

          rules_file_name: ".zap/rules.tsv"

          cmd_options: "-a -j -T 10"

          allow_issue_writing: false

          fail_action: false

      # ======================================================
      # 5. VÉRIFICATION DU RAPPORT
      # ======================================================

      - name: Check ZAP report
        if: always()

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ZAP REPORTS"
          echo "=========================================="

          if [ -f report_html.html ]; then
            echo "HTML report: FOUND"
          else
            echo "HTML report: NOT FOUND"
          fi

          if [ -f report_json.json ]; then
            echo "JSON report: FOUND"
          else
            echo "JSON report: NOT FOUND"
          fi

          if [ -f report_md.md ]; then
            echo "Markdown report: FOUND"
          else
            echo "Markdown report: NOT FOUND"
          fi

      # ======================================================
      # 6. ARCHIVAGE DES RAPPORTS
      # ======================================================

      - name: Upload ZAP Reports

        if: always()

        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3

        with:
          name: zap-dast-report-${{ github.run_id }}

          path: |
            report_html.html
            report_json.json
            report_md.md

          if-no-files-found: warn

          retention-days: 7

      # ======================================================
      # 7. RÉSUMÉ
      # ======================================================

      - name: DAST Summary
        if: always()

        run: |
          echo "=========================================="
          echo "       DAST SECURITY SCAN COMPLETED"
          echo "=========================================="
          echo "Target: ${{ steps.target.outputs.url }}"
          echo "Scanner: OWASP ZAP Baseline"
          echo "=========================================="